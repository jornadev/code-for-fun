name: code_for_fun
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Corrigido: '3.9.2' não é uma versão padrão. '>=3.3.0' é mais seguro e moderno.
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependências que estavam com indentação errada, agora corrigidas:
  provider: ^6.1.2
  cloud_firestore: ^4.17.3

  # Dependências do Firebase (removida a duplicata de firebase_auth):
  firebase_core: ^2.24.2
  firebase_auth: ^4.20.0
  firebase_database: ^10.4.0 # (Nota: Minha solução usou o Firestore, não o Realtime Database)

  # Dependência desnecessária removida (firebase_auth_platform_interface)

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/